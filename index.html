<!-- ADD THIS JUST ABOVE THE </head> TAG -->
<style>
    #scrutineer-section { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #15151e; z-index: 300; padding: 40px 20px; box-sizing: border-box; text-align: center; }
    .big-btn { width: 100%; height: 120px; font-size: 3rem; margin: 20px 0; border-radius: 20px; font-family: 'Orbitron'; }
</style>

<!-- ADD THIS JUST ABOVE THE <div id="admin-section"> TAG -->
<div id="scrutineer-section">
    <h2 id="scrutineer-team-name" style="font-family: Orbitron; font-size: 2rem;">TEAM NAME</h2>
    <hr border="1" color="#e10600">
    <button class="big-btn" style="background: #28a745;" onclick="quickLap(1)">+ LAP</button>
    <button class="big-btn" style="background: #444; height: 80px; font-size: 1.5rem;" onclick="quickLap(-1)">- LAP ERROR</button>
    <br><br>
    <button class="btn-neg" onclick="location.reload()">LOGOUT</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD8RwbZzEvpqWgrk2VKSj1XQAgrRQ-oieg",
        authDomain: "fone-7f6e5.firebaseapp.com",
        databaseURL: "https://fone-7f6e5-default-rtdb.firebaseio.com",
        projectId: "fone-7f6e5",
        storageBucket: "fone-7f6e5.firebasestorage.app",
        messagingSenderId: "540549386700",
        appId: "1:540549386700:web:59ebec898bd2e13f6c4d69"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentSort = 'both';
    let activeQuickId = null;

    // --- LOGIC FOR THE LOCK BOX ---
    function checkPassword() {
        const pass = prompt("Enter Access Key (Admin or Team Code):");
        if (!pass) return;

        const entry = pass.toUpperCase();

        if (entry === "CBS@2026") {
            document.getElementById('admin-section').style.display = "block";
        } else {
            // Check for Team Shortcut Keys (e.g., B1, R1)
            db.ref('scores').once('value', s => {
                let found = false;
                s.forEach(child => {
                    const car = child.val();
                    if (car.shortcut && car.shortcut.toUpperCase() === entry) {
                        openScrutineerMode(car);
                        found = true;
                    }
                });
                if (!found) alert("Access Denied: Invalid Code");
            });
        }
    }

    function openScrutineerMode(car) {
        activeQuickId = car.id;
        document.getElementById('scrutineer-team-name').innerText = car.house_name;
        document.getElementById('scrutineer-team-name').className = getColorClass(car.house_name);
        document.getElementById('scrutineer-section').style.display = "block";
    }

    function quickLap(change) {
        db.ref('scores/' + activeQuickId + '/laps').transaction(currentLaps => {
            return (currentLaps || 0) + change;
        });
    }

    // --- EXISTING ADMIN FUNCTIONS ---
    function setSort(type) {
        currentSort = type;
        document.querySelectorAll('.sort-options button').forEach(b => b.classList.remove('btn-active'));
        document.getElementById('sort-' + type).classList.add('btn-active');
        db.ref('scores').once('value', s => renderUI(s.val()));
    }

    function getColorClass(name) {
        const n = name.toLowerCase();
        if (n.includes('red')) return 'name-red';
        if (n.includes('blue')) return 'name-blue';
        if (n.includes('green')) return 'name-green';
        if (n.includes('yellow')) return 'name-yellow';
        return '';
    }

    db.ref('scores').on('value', (s) => renderUI(s.val()));

    function renderUI(data) {
        if (!data) return;
        const board = document.getElementById('leaderboard');
        const list = document.getElementById('admin-list');
        board.innerHTML = ''; list.innerHTML = '';

        const allCars = Object.values(data);
        const sortedCars = [...allCars].sort((a,b) => {
            if (currentSort === 'points') return b.points - a.points;
            if (currentSort === 'laps') return b.laps - a.laps;
            return b.points !== a.points ? b.points - a.points : b.laps - a.laps;
        });

        const adminCars = [...allCars].sort((a,b) => a.house_name.localeCompare(b.house_name));

        sortedCars.forEach((car, i) => {
            const color = getColorClass(car.house_name);
            const winLabel = car.isWinner ? `<div class="winner-badge">🏆 WINNER</div>` : '';
            const winnerClass = car.isWinner ? 'winner-active' : '';

            board.innerHTML += `
                <div class="row ${winnerClass}">
                    ${winLabel}
                    <div class="content">
                        <div class="rank">P${i+1}</div>
                        <div class="name ${color}">${car.house_name}</div>
                        <div class="stat-group">
                            <div class="stat-box"><span class="label">Laps</span><span class="value">${car.laps}</span></div>
                            <div class="stat-box"><span class="label">Points</span><span class="value">${car.points}</span></div>
                        </div>
                    </div>
                </div>`;
        });

        adminCars.forEach((car) => {
            const color = getColorClass(car.house_name);
            list.innerHTML += `
                <div class="admin-row">
                    <div class="admin-info">
                        <span class="${color}"><b>${car.house_name}</b> (Key: ${car.shortcut || 'None'})</span>
                        <span>L: <b>${car.laps}</b> | P: <b>${car.points}</b></span>
                    </div>
                    <div class="admin-btns">
                        <button onclick="upd('${car.id}','laps',${car.laps+1})">+ L</button>
                        <button class="btn-neg" onclick="upd('${car.id}','laps',${car.laps-1})">- L</button>
                        <input type="text" placeholder="Set Key" style="width:60px" onchange="upd('${car.id}','shortcut',this.value.toUpperCase())" value="${car.shortcut || ''}">
                        <button onclick="upd('${car.id}','points',${car.points+10})">+ 10</button>
                        <button class="btn-win" onclick="win('${car.id}', '${car.house_name}')">🏆 WIN</button>
                        <button style="background:#b00" onclick="del('${car.id}')">DEL</button>
                    </div>
                </div>`;
        });
    }

    window.upd = (id, k, v) => db.ref('scores/'+id).update({[k]: v});
    window.win = (id, name) => {
        if(confirm("Confirm " + name + " as CHAMPION?")) {
            db.ref('scores').once('value', s => {
                let up = {}; s.forEach(c => up[c.key+'/isWinner'] = false);
                db.ref('scores').update(up).then(() => db.ref('scores/'+id).update({isWinner: true}));
            });
        }
    };
    window.del = (id) => confirm("Delete team?") && db.ref('scores/'+id).remove();
    window.addNewTeam = () => {
        const n = document.getElementById('newTeamName').value; if(!n) return;
        const id = "t_"+Date.now(); 
        db.ref('scores/'+id).set({id, house_name:n, laps:0, points:0, isWinner:false, shortcut: ''});
        document.getElementById('newTeamName').value='';
    };
    window.resetAll = () => {
        if(confirm("Full Reset?")) db.ref('scores').once('value', s => {
            let up = {}; s.forEach(c => { up[c.key+'/laps']=0; up[c.key+'/points']=0; up[c.key+'/isWinner']=false; });
            db.ref('scores').update(up);
        });
    };
</script>
