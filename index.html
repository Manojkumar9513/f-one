<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC Championship Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');

        :root {
            --f1-red: #e10600;
            --dark-bg: #15151e;
            --card-bg: #1f1f27;
            --neon-blue: #00f2ff;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 4px solid var(--f1-red);
            padding-bottom: 10px;
            display: inline-block;
            width: 100%;
        }

        /* LEADERBOARD STYLES */
        .leaderboard-container {
            max-width: 900px;
            margin: 30px auto;
        }

        .row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            margin-bottom: 10px;
            padding: 15px;
            border-left: 10px solid var(--f1-red);
            transform: skew(-10deg);
            transition: all 0.5s ease;
        }

        .row:nth-child(1) { border-left-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }

        .content {
            transform: skew(10deg); /* Counter the parent skew */
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .rank { width: 50px; font-size: 1.5rem; color: var(--f1-red); }
        .name { flex-grow: 1; font-size: 1.2rem; text-transform: uppercase; }
        .stats { display: flex; gap: 20px; text-align: center; }
        .stat-box { background: #2b2b35; padding: 5px 15px; border-radius: 4px; min-width: 80px; }
        .label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; display: block; }

        /* ADMIN PANEL (Hidden by default or scroll down) */
        #admin-section {
            margin-top: 100px;
            padding: 20px;
            background: #2b2b35;
            border-radius: 10px;
            border: 2px dashed #444;
        }

        .admin-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        button {
            padding: 10px 20px;
            background: var(--f1-red);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>F1 RC Live Scoreboard</h1>

    <div class="leaderboard-container" id="leaderboard">
        <!-- Live data will load here -->
        <p style="text-align: center;">Initializing Engines...</p>
    </div>

    <!-- ADMIN SECTION: Access this on your phone -->
    <div id="admin-section">
        <h2 style="font-family: Orbitron;">Race Control (Phone Admin)</h2>
        <div id="admin-list"></div>
    </div>

    <script>
        // 1. CONFIGURATION (Replace with your Supabase Details)
        const SUPABASE_URL = 'https://wwucrxalldoyajtvmqot.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AP-_LBjMD3puD0jELQd9uA_9SfQWBlB';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. LOAD DATA
        async function fetchScores() {
            const { data, error } = await supabase
                .from('race_scores')
                .select('*')
                .order('points', { ascending: false });

            if (error) console.error(error);
            else renderLeaderboard(data);
        }

        // 3. DISPLAY LEADERBOARD
        function renderLeaderboard(data) {
            const container = document.getElementById('leaderboard');
            const adminList = document.getElementById('admin-list');
            
            container.innerHTML = '';
            adminList.innerHTML = '';

            data.forEach((car, index) => {
                // Public View
                container.innerHTML += `
                    <div class="row">
                        <div class="content">
                            <div class="rank">${index + 1}</div>
                            <div class="name">${car.house_name}</div>
                            <div class="stats">
                                <div class="stat-box"><span class="label">Laps</span>${car.laps}</div>
                                <div class="stat-box"><span class="label">Points</span>${car.points}</div>
                            </div>
                        </div>
                    </div>
                `;

                // Admin Controls
                adminList.innerHTML += `
                    <div class="admin-controls">
                        <span><strong>${car.house_name}</strong></span>
                        <div>
                            <button onclick="updateScore(${car.id}, 'laps', ${car.laps + 1})">+ Lap</button>
                            <button onclick="updateScore(${car.id}, 'points', ${car.points + 10})">+ 10 Pts</button>
                        </div>
                    </div>
                `;
            });
        }

        // 4. UPDATE DATA (From Phone)
        async function updateScore(id, field, newValue) {
            const { error } = await supabase
                .from('race_scores')
                .update({ [field]: newValue })
                .eq('id', id);

            if (error) alert("Error updating!");
        }

        // 5. REAL-TIME LISTENER
        // This makes the page update automatically when the DB changes
        const channel = supabase
            .channel('schema-db-changes')
            .on('postgres_changes', 
                { event: '*', schema: 'public', table: 'race_scores' }, 
                (payload) => { fetchScores(); }
            )
            .subscribe();

        // Initial Load
        fetchScores();
    </script>
</body>
</html>
