<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC LIVE SCOREBOARD</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');
        :root { 
            --f1-red: #e10600; 
            --dark-bg: #0b0b0f; 
            --card-bg: rgba(31, 31, 39, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold: #ffd700;
        }
        
        body { 
            background: radial-gradient(circle at top, #1a1a2e 0%, #0b0b0f 100%); 
            color: white; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Admin Lock Icon (Top Left) */
        #admin-lock-icon { 
            position: fixed; 
            top: 20px; 
            left: 20px; 
            cursor: pointer; 
            z-index: 100; 
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(10px);
            padding: 10px; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        #admin-lock-icon:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }

        /* Logo Styling (Top Right) */
        #logo-placeholder { position: fixed; top: 10px; right: 20px; width: 120px; height: 120px; z-index: 100; }
        #logo-placeholder img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(225, 6, 0, 0.3)); }

        h1 { 
            font-family: 'Orbitron', sans-serif; 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            background: linear-gradient(90deg, #fff 0%, var(--f1-red) 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 60px;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 900;
        }
        
        .leaderboard-container { max-width: 900px; margin: 0 auto; padding-bottom: 100px; }

        .row { 
            display: flex; 
            align-items: center; 
            background: var(--card-bg); 
            backdrop-filter: blur(15px);
            margin-bottom: 15px; 
            padding: 20px; 
            border-left: 6px solid var(--f1-red); 
            border-right: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border);
            transform: skew(-10deg); 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .row:hover { transform: skew(-10deg) translateX(10px); background: rgba(45, 45, 55, 0.8); }

        .row:first-child { 
            border-left-color: var(--gold); 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15); 
        }
        
        .winner-active { 
            transform: skew(-10deg) scale(1.05); 
            z-index: 10; 
            border: 2px solid var(--gold) !important; 
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3) !important; 
            margin: 30px 0; 
            animation: winnerGlow 2s infinite alternate;
        }
        @keyframes winnerGlow {
            from { box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); }
            to { box-shadow: 0 0 60px rgba(255, 215, 0, 0.5); }
        }

        .content { transform: skew(10deg); display: flex; width: 100%; justify-content: space-between; align-items: center; }

        .rank { width: 60px; font-size: 2.2rem; font-weight: 900; color: var(--f1-red); font-family: 'Orbitron'; font-style: italic; }
        .name { flex-grow: 1; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; text-align: left; margin-left: 25px; letter-spacing: 1px; }
        
        .name-red { color: #ff5555; text-shadow: 0 0 10px rgba(255,85,85,0.3); } 
        .name-blue { color: #55aaff; text-shadow: 0 0 10px rgba(85,170,255,0.3); } 
        .name-green { color: #55ff55; text-shadow: 0 0 10px rgba(85,255,85,0.3); } 
        .name-yellow { color: #ffff55; text-shadow: 0 0 10px rgba(255,255,85,0.3); }

        .stat-group { display: flex; gap: 20px; }
        .stat-box { 
            background: rgba(255,255,255,0.05); 
            padding: 10px 20px; 
            border-radius: 8px; 
            min-width: 80px; 
            border: 1px solid var(--glass-border);
        }
        .label { font-size: 0.75rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 700; }
        .value { font-size: 1.4rem; font-weight: 900; font-family: 'Orbitron'; color: #fff; }

        .winner-badge { 
            position: absolute; 
            top: -15px; 
            right: 20px; 
            background: linear-gradient(45deg, var(--gold), #fff); 
            color: black; 
            font-weight: 900; 
            font-size: 0.9rem; 
            padding: 6px 20px; 
            border-radius: 4px; 
            transform: skew(10deg); 
            font-family: 'Orbitron'; 
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); 
            z-index: 15; 
        }

        /* ADMIN PANEL */
        #admin-section { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle at center, #1f1f27 0%, #0b0b0f 100%); 
            z-index: 200; 
            overflow-y: auto; 
            padding: 40px; 
            box-sizing: border-box; 
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .sort-options { background: rgba(255,255,255,0.05); padding: 20px; margin-bottom: 30px; border-radius: 12px; display: flex; justify-content: center; gap: 15px; border: 1px solid var(--glass-border); }
        .admin-row { background: rgba(255,255,255,0.03); margin-bottom: 15px; padding: 20px; border-radius: 12px; border: 1px solid var(--glass-border); max-width: 900px; margin-inline: auto; display: flex; flex-direction: column; gap: 15px; }
        .admin-info { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        
        button { 
            padding: 12px 20px; 
            background: var(--f1-red); 
            border: none; 
            color: white; 
            font-weight: 900; 
            cursor: pointer; 
            border-radius: 4px; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            font-family: 'Orbitron';
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .btn-active { background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
        .btn-neg { background: #333; } 
        .btn-win { background: var(--gold); color: black; }
        
        input { 
            padding: 15px; 
            border-radius: 4px; 
            border: 1px solid var(--glass-border); 
            background: rgba(255,255,255,0.05); 
            color: white; 
            font-family: 'Orbitron';
            outline: none;
        }
        input:focus { border-color: var(--f1-red); }

        /* Syncing Animation */
        .sync-box { margin-top: 100px; }
        .spinner { 
            width: 50px; height: 50px; 
            border: 4px solid rgba(225, 6, 0, 0.1); 
            border-top: 4px solid var(--f1-red); 
            border-radius: 50%; 
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="admin-lock-icon" onclick="checkPassword()">🔒</div>

    <div id="logo-placeholder">
        <img src="cb.jpeg" alt="CBS LOGO" onerror="this.style.display='none'">
    </div>

    <h1>F1 RC LIVE SCOREBOARD</h1>

    <div class="leaderboard-container" id="leaderboard">
        <div class="sync-box">
            <div class="spinner"></div>
            <p style="font-family: Orbitron; letter-spacing: 2px; color: #888;">SYNCHRONIZING WITH RACE CONTROL...</p>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-section">
        <h2 style="font-family: Orbitron; color: var(--f1-red);">RACE CONTROL</h2>
        <button class="btn-neg" onclick="document.getElementById('admin-section').style.display='none'" style="margin-bottom:20px;">← EXIT ADMIN</button>
        
        <div class="sort-options">
            <span style="font-weight:bold; margin-right:10px; line-height: 2.5;">MAIN PAGE SORT:</span>
            <button id="sort-both" class="btn-active" onclick="setSort('both')">Auto (P+L)</button>
            <button id="sort-points" onclick="setSort('points')">Points Only</button>
            <button id="sort-laps" onclick="setSort('laps')">Laps Only</button>
        </div>

        <div id="admin-list"></div>
        
        <div style="margin-top: 30px; padding: 20px; border-top: 2px solid #333;">
            <input type="text" id="newTeamName" placeholder="New Team Name" style="padding:12px; border-radius:5px; border:none; width:200px;">
            <button onclick="addNewTeam()">Add Team</button>
            <br><br>
            <button style="background:orange;" onclick="resetAll()">⚠️ RESET ALL SCORES</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuPWonFQJLRnym_OHDGl-0ZI74nLH518o",
            authDomain: "f-one-e1ee1.firebaseapp.com",
            databaseURL: "https://f-one-e1ee1-default-rtdb.firebaseio.com",
            projectId: "f-one-e1ee1",
            storageBucket: "f-one-e1ee1.firebasestorage.app",
            messagingSenderId: "683637485146",
            appId: "1:683637485146:web:66bfb8586a68308ae4f263",
            measurementId: "G-YNJ1YHV5RS"
        };

        console.log("Initializing Firebase...");
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        console.log("Database initialized. Setting up listener...");
        let currentSort = 'both';

        function checkPassword() {
            if (prompt("Enter Access Key:") === "CBS@2026") document.getElementById('admin-section').style.display = "block";
            else alert("Denied!");
        }

        function setSort(type) {
            currentSort = type;
            document.querySelectorAll('.sort-options button').forEach(b => b.classList.remove('btn-active'));
            db.ref('scores').once('value', s => renderUI(s.val()), (err) => console.error("Sort Fetch Error:", err));
        }

        function getColorClass(name) {
            if (!name) return '';
            const n = name.toLowerCase();
            return n.includes('red')?'name-red':n.includes('blue')?'name-blue':n.includes('green')?'name-green':n.includes('yellow')?'name-yellow':'';
        }

        db.ref('scores').on('value', (s) => {
            console.log("Data snapshot received.");
            renderUI(s.val());
        }, (err) => {
            console.error("Firebase Listener Error:", err);
            let msg = err.message;
            if (msg.includes("permission_denied")) msg = "PERMISSION DENIED: Please set your Firebase Database Rules to public (.read: true, .write: true)";
            document.getElementById('leaderboard').innerHTML = `<p style="color: #ff4d4d; background: rgba(255,0,0,0.1); padding: 20px; border-radius: 8px;"><b>Connection Error:</b><br>${msg}</p>`;
        });

        function renderUI(data) {
            try {
                console.log("Firebase Data Received:", data);
                const board = document.getElementById('leaderboard');
                const list = document.getElementById('admin-list');
                
                if (!data) {
                    board.innerHTML = `
                        <div style="margin-top: 100px; padding: 40px; border: 1px dashed #444; border-radius: 12px; background: rgba(255,255,255,0.02);">
                            <p style="font-family: Orbitron; color: #888; font-size: 1.2rem;">RACE STATUS: NO TEAMS REGISTERED</p>
                            <p style="color: #666; font-size: 0.9rem;">Click the 🔒 icon in the corner to register teams and start the race.</p>
                        </div>`;
                    list.innerHTML = '<p style="color: #aaa; padding: 20px; font-family: Orbitron;">WAITING FOR DATA...</p>';
                    return;
                }
                board.innerHTML = ''; list.innerHTML = '';

            const allCars = Object.values(data);

            const sortedCars = [...allCars].sort((a,b) => {
                if (currentSort === 'points') return b.points - a.points;
                if (currentSort === 'laps') return b.laps - a.laps;
                return b.points !== a.points ? b.points - a.points : b.laps - a.laps;
            });

            const adminCars = [...allCars].sort((a,b) => (a.house_name || '').localeCompare(b.house_name || ''));

            sortedCars.forEach((car, i) => {
                const color = getColorClass(car.house_name);
                const winLabel = car.isWinner ? `<div class="winner-badge">🏆 WINNER</div>` : '';
                const winnerClass = car.isWinner ? 'winner-active' : '';

                board.innerHTML += `
                    <div class="row ${winnerClass}">
                        ${winLabel}
                        <div class="content">
                            <div class="rank">P${i+1}</div>
                            <div class="name ${color}">${car.house_name || 'Unnamed Team'}</div>
                            <div class="stat-group">
                                <div class="stat-box"><span class="label">Laps</span><span class="value">${car.laps || 0}</span></div>
                                <div class="stat-box"><span class="label">Points</span><span class="value">${car.points || 0}</span></div>
                            </div>
                        </div>
                    </div>`;
            });

            adminCars.forEach((car) => {
                const color = getColorClass(car.house_name);
                list.innerHTML += `
                    <div class="admin-row">
                        <div class="admin-info">
                            <span class="${color}"><b>${car.house_name || 'Unnamed Team'}</b></span>
                            <span>L: <b>${car.laps || 0}</b> | P: <b>${car.points || 0}</b></span>
                        </div>
                        <div class="admin-btns">
                            <button onclick="upd('${car.id}','laps',${(car.laps || 0)+1})">+ L</button>
                            <button class="btn-neg" onclick="upd('${car.id}','laps',${(car.laps || 0)-1})">- L</button>
                            <button onclick="upd('${car.id}','points',${(car.points || 0)+10})">+ 10</button>
                            <button class="btn-win" onclick="win('${car.id}', '${car.house_name || 'Unnamed'}')">🏆 WIN</button>
                            <button style="background:#b00" onclick="del('${car.id}')">DEL</button>
                        </div>
                    </div>`;
            });
            } catch (e) {
                console.error("Render Error:", e);
            }
        }

        window.upd = (id, k, v) => db.ref('scores/'+id).update({[k]: v});
        window.win = (id, name) => {
            if(confirm("Confirm " + name + " as CHAMPION?")) {
                db.ref('scores').once('value', s => {
                    let up = {}; s.forEach(c => up[c.key+'/isWinner'] = false);
                    db.ref('scores').update(up).then(() => db.ref('scores/'+id).update({isWinner: true}));
                });
            }
        };
        window.del = (id) => confirm("Delete team?") && db.ref('scores/'+id).remove();
        window.addNewTeam = () => {
            const n = document.getElementById('newTeamName').value; if(!n) return;
            const id = "t_"+Date.now(); db.ref('scores/'+id).set({id, house_name:n, laps:0, points:0, isWinner:false});
            document.getElementById('newTeamName').value='';
        };
        window.resetAll = () => {
            if(confirm("Full Reset?")) db.ref('scores').once('value', s => {
                let up = {}; s.forEach(c => { up[c.key+'/laps']=0; up[c.key+'/points']=0; up[c.key+'/isWinner']=false; });
                db.ref('scores').update(up);
            });
        };
    </script>
</body>
</html>
