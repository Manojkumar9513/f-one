<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC Championship Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');
        :root { --f1-red: #e10600; --dark-bg: #15151e; --card-bg: #1f1f27; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 5px; border-bottom: 4px solid var(--f1-red); padding-bottom: 10px; }
        .row { display: flex; align-items: center; background: var(--card-bg); margin-bottom: 12px; padding: 15px; border-left: 10px solid var(--f1-red); transform: skew(-10deg); }
        .content { transform: skew(10deg); display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .rank { width: 50px; font-size: 1.5rem; font-weight: 900; color: var(--f1-red); }
        .name { flex-grow: 1; font-size: 1.2rem; font-weight: 700; text-align: left; margin-left: 15px; }
        .stat-box { background: #2b2b35; padding: 5px 15px; border-radius: 5px; margin-left: 10px; }
        .label { font-size: 0.6rem; color: #aaa; display: block; }
        #admin-section { margin-top: 50px; padding: 20px; background: #1a1a24; border-radius: 10px; border: 1px solid #333; }
        .admin-controls { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; align-items: center;}
        button { padding: 12px 18px; background: var(--f1-red); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>F1 RC LIVE SCOREBOARD</h1>

    <div id="leaderboard">
        <p>Warming up engines...</p>
    </div>

    <div id="admin-section">
        <h2 style="font-family: Orbitron; font-size: 0.9rem;">RACE CONTROL</h2>
        <div id="admin-list"></div>
    </div>

    <script>
        // We wrap everything in window.onload so the library is definitely ready
        window.onload = function() {
            const URL = 'https://wwucrxalldoyajtvmqot.supabase.co';
            const KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dWNyeGFsbGRveWFqdHZtcW90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODg3MDksImV4cCI6MjA5MzQ2NDcwOX0.oYbjxyXs7f2OLOjBScKN4a0WN1c0LwSZXPA6k4OTA8A';

            if (typeof supabase === 'undefined') {
                document.getElementById('leaderboard').innerHTML = "Error: Library not loaded. Check internet.";
                return;
            }

            const sb = supabase.createClient(URL, KEY);

            async function refresh() {
                const { data, error } = await sb.from('race_scores').select('*').order('points', { ascending: false });
                
                if (error) {
                    console.error(error);
                    document.getElementById('leaderboard').innerHTML = "Error: " + error.message;
                    return;
                }
                
                const board = document.getElementById('leaderboard');
                const list = document.getElementById('admin-list');
                board.innerHTML = '';
                list.innerHTML = '';

                data.forEach((car, i) => {
                    board.innerHTML += `
                        <div class="row">
                            <div class="content">
                                <div class="rank">P${i+1}</div>
                                <div class="name">${car.house_name}</div>
                                <div class="stat-box"><span class="label">Laps</span><b>${car.laps}</b></div>
                                <div class="stat-box"><span class="label">Points</span><b>${car.points}</b></div>
                            </div>
                        </div>`;

                    list.innerHTML += `
                        <div class="admin-controls">
                            <span style="font-size:0.8rem">${car.house_name}</span>
                            <div>
                                <button onclick="updateData(${car.id}, 'laps', ${car.laps + 1})">+ L</button>
                                <button onclick="updateData(${car.id}, 'points', ${car.points + 10})">+ 10</button>
                            </div>
                        </div>`;
                });
            }

            // Global function so buttons can find it
            window.updateData = async function(id, col, val) {
                await sb.from('race_scores').update({ [col]: val }).eq('id', id);
                refresh();
            };

            sb.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'race_scores' }, () => refresh()).subscribe();

            refresh();
        };
    </script>
</body>
</html>
