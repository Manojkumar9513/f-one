<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC Championship Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');

        :root {
            --f1-red: #e10600;
            --dark-bg: #15151e;
            --card-bg: #1f1f27;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 4px solid var(--f1-red);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 15px;
            border-left: 10px solid var(--f1-red);
            transform: skew(-10deg);
            transition: all 0.4s ease;
        }

        /* Gold highlight for 1st place */
        .row:first-child { 
            border-left-color: #ffd700; 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); 
        }

        .content {
            transform: skew(10deg); /* Counter the parent skew */
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .rank { width: 50px; font-size: 1.8rem; font-weight: 900; color: var(--f1-red); }
        .name { flex-grow: 1; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; text-align: left; margin-left: 20px; }
        
        .stat-group { display: flex; gap: 15px; }
        .stat-box { background: #2b2b35; padding: 8px 20px; border-radius: 5px; min-width: 80px; }
        .label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 2px; }
        .value { font-size: 1.2rem; font-weight: 900; font-family: 'Orbitron'; }

        /* Mobile Admin Panel */
        #admin-section {
            margin-top: 80px;
            padding: 25px;
            background: #1a1a24;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .admin-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .btn-group { display: flex; gap: 10px; }
        
        button {
            padding: 12px 20px;
            background: var(--f1-red);
            border: none;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button:active { transform: scale(0.9); }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
