<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 LIVE SCOREBOARD</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');
        :root { --f1-red: #e10600; --dark-bg: #15151e; --card-bg: #1f1f27; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 5px; border-bottom: 4px solid var(--f1-red); padding-bottom: 10px; }
        .row { display: flex; align-items: center; background: var(--card-bg); margin-bottom: 12px; padding: 15px; border-left: 10px solid var(--f1-red); transform: skew(-10deg); transition: 0.3s; }
        .row:first-child { border-left-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .content { transform: skew(10deg); display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .rank { width: 50px; font-size: 1.5rem; font-weight: 900; color: var(--f1-red); }
        .name { flex-grow: 1; font-size: 1.2rem; font-weight: 700; text-align: left; margin-left: 15px; }
        .stat-box { background: #2b2b35; padding: 5px 15px; border-radius: 5px; margin-left: 10px; min-width: 60px; }
        .label { font-size: 0.6rem; color: #aaa; display: block; }
        #admin-section { margin-top: 50px; padding: 20px; background: #1a1a24; border-radius: 10px; border: 1px solid #333; }
        .admin-controls { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; align-items: center; }
        button { padding: 12px 18px; background: var(--f1-red); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>F1 RC LIVE SCOREBOARD</h1>
    <div id="leaderboard">Connecting to Pit Wall...</div>

    <div id="admin-section">
        <h2 style="font-family: Orbitron; font-size: 0.9rem;">RACE CONTROL</h2>
        <div id="admin-list"></div>
    </div>

    <script>
        // 1. YOUR FIREBASE CONFIG (Paste yours here)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. LISTEN FOR DATA
        db.ref('scores').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                // If DB is empty, let's create initial data
                db.ref('scores').set({
                    "1": { id: 1, house_name: "Red House", laps: 0, points: 0 },
                    "2": { id: 2, house_name: "Blue House", laps: 0, points: 0 },
                    "3": { id: 3, house_name: "Green House", laps: 0, points: 0 }
                });
                return;
            }
            renderUI(data);
        });

        // 3. RENDER UI
        function renderUI(dataObject) {
            const board = document.getElementById('leaderboard');
            const list = document.getElementById('admin-list');
            board.innerHTML = '';
            list.innerHTML = '';

            // Convert object to array and sort by points
            const cars = Object.values(dataObject).sort((a, b) => b.points - a.points);

            cars.forEach((car, i) => {
                board.innerHTML += `
                    <div class="row">
                        <div class="content">
                            <div class="rank">P${i+1}</div>
                            <div class="name">${car.house_name}</div>
                            <div class="stat-box"><span class="label">Laps</span><b>${car.laps}</b></div>
                            <div class="stat-box"><span class="label">Points</span><b>${car.points}</b></div>
                        </div>
                    </div>`;

                list.innerHTML += `
                    <div class="admin-controls">
                        <span>${car.house_name}</span>
                        <div>
                            <button onclick="updateVal('${car.id}', 'laps', ${car.laps + 1})">+ L</button>
                            <button onclick="updateVal('${car.id}', 'points', ${car.points + 10})">+ 10</button>
                        </div>
                    </div>`;
            });
        }

        // 4. UPDATE DATA
        window.updateVal = function(id, key, newVal) {
            db.ref('scores/' + id).update({ [key]: newVal });
        };
    </script>
</body>
</html>
