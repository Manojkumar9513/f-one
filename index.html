<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC Championship Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');

        :root {
            --f1-red: #e10600;
            --dark-bg: #15151e;
            --card-bg: #1f1f27;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 4px solid var(--f1-red);
            padding-bottom: 10px;
        }

        .leaderboard-container {
            max-width: 800px;
            margin: 30px auto;
        }

        .row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            margin-bottom: 10px;
            padding: 15px;
            border-left: 10px solid var(--f1-red);
            transform: skew(-10deg);
            transition: all 0.4s ease;
        }

        .row:first-child { border-left-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

        .content {
            transform: skew(10deg);
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .rank { width: 40px; font-size: 1.5rem; font-weight: 900; color: var(--f1-red); }
        .name { flex-grow: 1; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; }
        .stat-box { background: #2b2b35; padding: 5px 15px; border-radius: 4px; margin-left: 10px; text-align: center; }
        .label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; display: block; }

        #admin-section {
            margin-top: 50px;
            padding: 20px;
            background: #1a1a24;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .admin-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        button {
            padding: 12px 18px;
            background: var(--f1-red);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 5px;
        }

        button:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <h1>F1 RC LIVE SCOREBOARD</h1>

    <div class="leaderboard-container" id="leaderboard">
        <p style="text-align: center;">Warming up tires...</p>
    </div>

    <div id="admin-section">
        <h2 style="font-family: Orbitron; font-size: 1rem;">RACE CONTROL (Mobile Update)</h2>
        <div id="admin-list"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wwucrxalldoyajtvmqot.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dWNyeGFsbGRveWFqdHZtcW90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODg3MDksImV4cCI6MjA5MzQ2NDcwOX0.oYbjxyXs7f2OLOjBScKN4a0WN1c0LwSZXPA6k4OTA8A';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function getRaceData() {
            const { data, error } = await sb
                .from('race_scores')
                .select('*')
                .order('points', { ascending: false });

            if (error) console.error("Error:", error);
            else drawUI(data);
        }

        function drawUI(data) {
            const board = document.getElementById('leaderboard');
            const controls = document.getElementById('admin-list');
            board.innerHTML = '';
            controls.innerHTML = '';

            data.forEach((car, index) => {
                // Public View
                board.innerHTML += `
                    <div class="row">
                        <div class="content">
                            <div class="rank">${index + 1}</div>
                            <div class="name">${car.house_name}</div>
                            <div class="stat-box"><span class="label">Laps</span>${car.laps}</div>
                            <div class="stat-box"><span class="label">Points</span>${car.points}</div>
                        </div>
                    </div>`;

                // Control View
                controls.innerHTML += `
                    <div class="admin-controls">
                        <span>${car.house_name}</span>
                        <div>
                            <button onclick="updateData(${car.id}, 'laps', ${car.laps + 1})">+ Lap</button>
                            <button onclick="updateData(${car.id}, 'points', ${car.points + 10})">+ 10 Pts</button>
                        </div>
                    </div>`;
            });
        }

        async function updateData(id, field, value) {
            await sb.from('race_scores').update({ [field]: value }).eq('id', id);
        }

        // Real-time Update Logic
        sb.channel('custom-all-channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'race_scores' }, () => {
              getRaceData();
          })
          .subscribe();

        getRaceData();
    </script>
</body>
</html>
