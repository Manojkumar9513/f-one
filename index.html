<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC LIVE SCOREBOARD</title>
    <!-- Firebase SDKs (Compat version for high stability in single files) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@300;700&display=swap');
        :root { --f1-red: #e10600; --dark-bg: #15151e; --card-bg: #1f1f27; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 5px; border-bottom: 4px solid var(--f1-red); padding-bottom: 10px; margin-bottom: 30px; }
        .row { display: flex; align-items: center; background: var(--card-bg); margin-bottom: 12px; padding: 15px; border-left: 10px solid var(--f1-red); transform: skew(-10deg); transition: 0.5s ease; }
        .row:first-child { border-left-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        .content { transform: skew(10deg); display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .rank { width: 50px; font-size: 1.5rem; font-weight: 900; color: var(--f1-red); }
        .name { flex-grow: 1; font-size: 1.2rem; font-weight: 700; text-align: left; margin-left: 15px; }
        .stat-box { background: #2b2b35; padding: 5px 15px; border-radius: 5px; margin-left: 10px; min-width: 65px; }
        .label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; display: block; }
        #admin-section { margin-top: 60px; padding: 20px; background: #1a1a24; border-radius: 12px; border: 1px dashed #444; max-width: 800px; margin-left: auto; margin-right: auto; }
        .admin-controls { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; align-items: center; }
        button { padding: 12px 18px; background: var(--f1-red); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-size: 0.8rem; }
        button:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <h1>F1 RC LIVE SCOREBOARD</h1>
    <div id="leaderboard">
        <p>Connecting to Pit Wall...</p>
    </div>

    <div id="admin-section">
        <h2 style="font-family: Orbitron; font-size: 0.9rem; color: #aaa;">RACE CONTROL (Phone Update)</h2>
        <div id="admin-list"></div>
    </div>

    <script>
        // Data from your screenshot
        const firebaseConfig = {
            apiKey: "AIzaSyD8RwbZzEvpqWgrk2VKSj1XQAgrRQ-oieg",
            authDomain: "fone-7f6e5.firebaseapp.com",
            databaseURL: "https://fone-7f6e5-default-rtdb.firebaseio.com",
            projectId: "fone-7f6e5",
            storageBucket: "fone-7f6e5.firebasestorage.app",
            messagingSenderId: "540549386700",
            appId: "1:540549386700:web:59ebec898bd2e13f6c4d69",
            measurementId: "G-83VSY2CB1P"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. DATA LISTENER & INITIALIZER
        db.ref('scores').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                console.log("Empty DB! Initializing houses...");
                db.ref('scores').set({
                    "car1": { id: "car1", house_name: "Red House", laps: 0, points: 0 },
                    "car2": { id: "car2", house_name: "Blue House", laps: 0, points: 0 },
                    "car3": { id: "car3", house_name: "Green House", laps: 0, points: 0 },
                    "car4": { id: "car4", house_name: "Yellow House", laps: 0, points: 0 }
                });
                return;
            }
            renderUI(data);
        });

        // 2. RENDER THE INTERFACE
        function renderUI(dataObject) {
            const board = document.getElementById('leaderboard');
            const list = document.getElementById('admin-list');
            board.innerHTML = '';
            list.innerHTML = '';

            // Sort cars by points so the leader is always at the top
            const cars = Object.values(dataObject).sort((a, b) => b.points - a.points);

            cars.forEach((car, i) => {
                // Public Scoreboard
                board.innerHTML += `
                    <div class="row">
                        <div class="content">
                            <div class="rank">P${i+1}</div>
                            <div class="name">${car.house_name}</div>
                            <div class="stat-box"><span class="label">Laps</span><b>${car.laps}</b></div>
                            <div class="stat-box"><span class="label">Points</span><b>${car.points}</b></div>
                        </div>
                    </div>`;

                // Admin Controls
                list.innerHTML += `
                    <div class="admin-controls">
                        <span style="font-weight:bold;">${car.house_name}</span>
                        <div>
                            <button onclick="updateVal('${car.id}', 'laps', ${car.laps + 1})">+ Lap</button>
                            <button onclick="updateVal('${car.id}', 'points', ${car.points + 10})">+ 10 Pts</button>
                        </div>
                    </div>`;
            });
        }

        // 3. LIVE UPDATE FUNCTION
        window.updateVal = function(carId, field, newValue) {
            db.ref('scores/' + carId).update({ [field]: newValue });
        };
    </script>
</body>
</html>
