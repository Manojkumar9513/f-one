<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 RC Championship Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><script>
    // 1. CONFIGURATION
    const SUPABASE_URL = 'https://wwucrxalldoyajtvmqot.supabase.co';
    
    // !!! ACTION REQUIRED: REPLACE THIS WITH YOUR LONG 'anon' 'public' KEY (Starts with eyJ...)
    const SUPABASE_KEY = 'YOUR_ANON_PUBLIC_KEY_HERE'; 

    // Fixed: Renamed the constant to 'sbClient' to avoid conflict with the 'supabase' library name
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. LOAD DATA
    async function fetchScores() {
        const { data, error } = await sbClient
            .from('race_scores')
            .select('*')
            .order('points', { ascending: false });

        if (error) {
            console.error("Fetch Error:", error);
            document.getElementById('leaderboard').innerHTML = `<p>Error: ${error.message}</p>`;
        } else {
            renderLeaderboard(data);
        }
    }

    // 3. DISPLAY LEADERBOARD
    function renderLeaderboard(data) {
        const container = document.getElementById('leaderboard');
        const adminList = document.getElementById('admin-list');
        
        container.innerHTML = '';
        adminList.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center;">No cars found. Add rows in Supabase!</p>';
            return;
        }

        data.forEach((car, index) => {
            container.innerHTML += `
                <div class="row">
                    <div class="content">
                        <div class="rank">${index + 1}</div>
                        <div class="name">${car.house_name}</div>
                        <div class="stats">
                            <div class="stat-box"><span class="label">Laps</span>${car.laps}</div>
                            <div class="stat-box"><span class="label">Points</span>${car.points}</div>
                        </div>
                    </div>
                </div>
            `;

            adminList.innerHTML += `
                <div class="admin-controls">
                    <span><strong>${car.house_name}</strong></span>
                    <div>
                        <button onclick="updateScore(${car.id}, 'laps', ${car.laps + 1})">+ Lap</button>
                        <button onclick="updateScore(${car.id}, 'points', ${car.points + 10})">+ 10 Pts</button>
                    </div>
                </div>
            `;
        });
    }

    // 4. UPDATE DATA (From Phone)
    async function updateScore(id, field, newValue) {
        const { error } = await sbClient
            .from('race_scores')
            .update({ [field]: newValue })
            .eq('id', id);

        if (error) alert("Update Failed: " + error.message);
    }

    // 5. REAL-TIME LISTENER
    sbClient
        .channel('schema-db-changes')
        .on('postgres_changes', 
            { event: '*', schema: 'public', table: 'race_scores' }, 
            (payload) => { fetchScores(); }
        )
        .subscribe();

    // Initial Load
    fetchScores();
</script>
</body>
</html>
